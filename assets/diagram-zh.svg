<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Lead 模式怎么派活：需求 → Lead 拆活派活（控制面）→ 共享任务板与工作日志 → 并行成员执行 → 独立成员验收 → 收工通知回到 Lead">
  <title>Lead 模式怎么派活</title>
  <defs>
    <pattern id="dotGridZh" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#60A5FA" opacity="0.12"/>
    </pattern>
    <linearGradient id="canvasBgZh" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070D1E"/>
      <stop offset="1" stop-color="#0C152C"/>
    </linearGradient>
    <radialGradient id="leadGlowZh" cx="358" cy="176" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowBlueZh" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowMutedZh" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="1278.5" height="478.5" rx="24" fill="url(#canvasBgZh)" stroke="#1E2E52" stroke-width="1.5"/>
  <rect x="1" y="1" width="1278" height="478" rx="24" fill="url(#dotGridZh)"/>
  <circle cx="358" cy="176" r="210" fill="url(#leadGlowZh)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', Arial, sans-serif">
    <!-- 顶栏 -->
    <text x="44" y="64" font-size="27" font-weight="700" fill="#F1F5F9">Lead 模式怎么派活</text>
    <rect x="980" y="37" width="256" height="36" rx="18" fill="#101D3B" stroke="#284074" stroke-width="1.2"/>
    <text x="1108" y="60" font-size="14" font-weight="600" text-anchor="middle" fill="#93C5FD">控制面 · 业务面分离</text>

    <!-- 并行层叠底卡 (对应第 4 卡 x=782, w=216) -->
    <rect x="794" y="106" width="216" height="124" rx="16" fill="#0E1832" stroke="#223359" stroke-width="1.2" opacity="0.65"/>
    <rect x="788" y="112" width="216" height="124" rx="16" fill="#101B38" stroke="#263963" stroke-width="1.2" opacity="0.85"/>

    <!-- 卡 1: 需求 (x=44, w=156, center=122) -->
    <rect x="44" y="118" width="156" height="124" rx="16" fill="#101A34" stroke="#2A3C64" stroke-width="1.5"/>
    <text x="122" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#7DD3FC">01 · 输入</text>
    <text x="122" y="180" font-size="22" font-weight="700" text-anchor="middle" fill="#F1F5F9">需求</text>
    <text x="122" y="210" font-size="15" text-anchor="middle" fill="#94A3B8">定目标与主判据</text>

    <!-- 卡 2: Lead (x=242, w=232, center=358) -->
    <rect x="242" y="118" width="232" height="124" rx="16" fill="#14234B" stroke="#4D6BFE" stroke-width="2.2"/>
    <text x="358" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#93C5FD">02 · 控制面</text>
    <text x="358" y="180" font-size="23" font-weight="700" text-anchor="middle" fill="#FFFFFF">Lead 拆活派活</text>
    <text x="358" y="210" font-size="15" text-anchor="middle" fill="#CBD5E1">判级 · 派单 · 讲结论</text>

    <!-- 卡 3: 共享任务板 · 日志 (x=516, w=224, center=628) -->
    <rect x="516" y="118" width="224" height="124" rx="16" fill="#101A34" stroke="#2A3C64" stroke-width="1.5"/>
    <text x="628" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#7DD3FC">03 · 协作账本</text>
    <text x="628" y="180" font-size="21" font-weight="700" text-anchor="middle" fill="#F1F5F9">共享任务板 · 日志</text>
    <text x="628" y="210" font-size="15" text-anchor="middle" fill="#94A3B8">owner · 写作用域</text>

    <!-- 卡 4: 并行成员执行 (x=782, w=216, center=890) -->
    <rect x="782" y="118" width="216" height="124" rx="16" fill="#101A34" stroke="#36518A" stroke-width="1.6"/>
    <text x="890" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#7DD3FC">04 · 业务面</text>
    <text x="890" y="180" font-size="21" font-weight="700" text-anchor="middle" fill="#F1F5F9">成员并行执行</text>
    <text x="890" y="210" font-size="15" text-anchor="middle" fill="#94A3B8">独立上下文 · 不重叠文件</text>

    <!-- 卡 5: 独立成员验收 (x=1040, w=196, center=1138) -->
    <rect x="1040" y="118" width="196" height="124" rx="16" fill="#0E2036" stroke="#34D399" stroke-width="1.8"/>
    <text x="1138" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#6EE7B7">05 · 验收</text>
    <text x="1138" y="180" font-size="21" font-weight="700" text-anchor="middle" fill="#F1F5F9">独立成员验收</text>
    <text x="1138" y="210" font-size="15" text-anchor="middle" fill="#A7F3D0">复跑核证 · 带回证据</text>

    <!-- 前向箭头 -->
    <g stroke="#60A5FA" stroke-width="2.4" marker-end="url(#arrowBlueZh)">
      <line x1="204" y1="180" x2="236" y2="180"/>
      <line x1="478" y1="180" x2="510" y2="180"/>
      <line x1="744" y1="180" x2="776" y2="180"/>
      <line x1="1002" y1="180" x2="1034" y2="180"/>
    </g>

    <!-- 枝节下沉分支 -->
    <line x1="278" y1="242" x2="278" y2="286" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrowMutedZh)"/>
    <rect x="158" y="294" width="236" height="34" rx="10" fill="#0E172E" stroke="#2D3E63" stroke-width="1.2"/>
    <text x="276" y="316" font-size="14" font-weight="500" text-anchor="middle" fill="#94A3B8">枝节不进队列 → leftovers.md</text>

    <!-- 虚线回路 -->
    <path d="M 1138 242 V 378 H 424 V 250" fill="none" stroke="#4D6BFE" stroke-width="2.4" stroke-dasharray="9 7" opacity="0.85" marker-end="url(#arrowBlueZh)"/>
    <rect x="592" y="362" width="400" height="32" rx="16" fill="#0B1328" stroke="#243A6B" stroke-width="1"/>
    <text x="792" y="383" font-size="15" font-weight="500" text-anchor="middle" fill="#93C5FD">收工通知 → 起下一轮（主判据全过即停）</text>

    <!-- 底栏 -->
    <text x="44" y="440" font-size="16" fill="#94A3B8">Lead 派完活就结束回合，不用 wait_agent 轮询，返工也不自己补位；由没参与实现的独立成员复跑核证。</text>
  </g>
</svg>

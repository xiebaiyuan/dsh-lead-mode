<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="dsh-lead-mode icon">
  <title>dsh-lead-mode</title>
  <defs>
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111E42"/>
      <stop offset="0.52" stop-color="#091126"/>
      <stop offset="1" stop-color="#050915"/>
    </linearGradient>

    <radialGradient id="indigoBloom" cx="512" cy="518" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#4D6BFE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanSheen" cx="512" cy="140" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="0.65" stop-color="#38BDF8" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassRim" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#4D6BFE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="orbitGrad" x1="210" y1="220" x2="810" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="beamTop" x1="512" y1="386" x2="512" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="beamBR" x1="626.32" y1="584" x2="714.65" y2="635" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="beamBL" x1="397.68" y1="584" x2="309.35" y2="635" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="leadRim" x1="390" y1="396" x2="634" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>

    <linearGradient id="leadCore" x1="418" y1="424" x2="606" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D8CFF"/>
      <stop offset="0.52" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#2944D1"/>
    </linearGradient>

    <linearGradient id="topSpecular" x1="512" y1="412" x2="512" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep cosmic glass squircle -->
  <g clip-path="url(#squircleClip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)"/>
    <circle cx="512" cy="518" r="420" fill="url(#indigoBloom)"/>
    <circle cx="512" cy="140" r="380" fill="url(#cyanSheen)"/>
  </g>
  <rect x="10" y="10" width="1004" height="1004" rx="222" ry="222" fill="none" stroke="url(#glassRim)" stroke-width="3"/>

  <!-- Subtle inner calibration ring -->
  <circle cx="512" cy="518" r="214" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="8 14" opacity="0.18"/>

  <!-- Outer orbital task-board ring (3 segments with clean 22deg station gaps) -->
  <g fill="none" stroke="url(#orbitGrad)" stroke-width="12" stroke-linecap="round" opacity="0.62">
    <path d="M 622.88 243.55 A 296 296 0 0 1 805.12 559.20"/>
    <path d="M 694.24 751.25 A 296 296 0 0 1 329.76 751.25"/>
    <path d="M 218.88 559.20 A 296 296 0 0 1 401.12 243.55"/>
  </g>

  <!-- Three high-contrast routing light tracks (outer glow + bright filament) -->
  <g stroke-linecap="round">
    <line x1="512" y1="386" x2="512" y2="284" stroke="url(#beamTop)" stroke-width="28"/>
    <line x1="626.32" y1="584" x2="714.65" y2="635" stroke="url(#beamBR)" stroke-width="28"/>
    <line x1="397.68" y1="584" x2="309.35" y2="635" stroke="url(#beamBL)" stroke-width="28"/>

    <line x1="512" y1="386" x2="512" y2="284" stroke="#E0F2FE" stroke-width="7" opacity="0.92"/>
    <line x1="626.32" y1="584" x2="714.65" y2="635" stroke="#E0F2FE" stroke-width="7" opacity="0.92"/>
    <line x1="397.68" y1="584" x2="309.35" y2="635" stroke="#E0F2FE" stroke-width="7" opacity="0.92"/>
  </g>

  <!-- Center Lead Beacon Core -->
  <g>
    <circle cx="512" cy="518" r="134" fill="#0B1530" stroke="url(#leadRim)" stroke-width="10"/>
    <circle cx="512" cy="518" r="106" fill="url(#leadCore)"/>
    <ellipse cx="512" cy="462" rx="68" ry="38" fill="url(#topSpecular)"/>
    <!-- Faceted 4-point command star emblem -->
    <path d="M 512 444 L 533 497 L 586 518 L 533 539 L 512 592 L 491 539 L 438 518 L 491 497 Z" fill="#F8FAFC"/>
    <path d="M 512 518 L 586 518 L 533 539 L 512 592 Z" fill="#BFDBFE" opacity="0.45"/>
  </g>

  <!-- Top Station: Independent Verifier (emerald-mint core) -->
  <g>
    <circle cx="512" cy="222" r="62" fill="#0D1834" stroke="#E6F0FF" stroke-width="20"/>
    <circle cx="512" cy="222" r="30" fill="#34D399" opacity="0.24"/>
    <circle cx="512" cy="222" r="19" fill="#34D399"/>
    <circle cx="512" cy="222" r="8" fill="#D1FAE5"/>
  </g>

  <!-- Bottom-Right Station: Parallel Member -->
  <g>
    <circle cx="768.34" cy="666" r="62" fill="#0D1834" stroke="#E6F0FF" stroke-width="20"/>
    <circle cx="768.34" cy="666" r="21" fill="#93C5FD"/>
    <circle cx="768.34" cy="666" r="9" fill="#E0F2FE"/>
  </g>

  <!-- Bottom-Left Station: Parallel Member -->
  <g>
    <circle cx="255.66" cy="666" r="62" fill="#0D1834" stroke="#E6F0FF" stroke-width="20"/>
    <circle cx="255.66" cy="666" r="21" fill="#93C5FD"/>
    <circle cx="255.66" cy="666" r="9" fill="#E0F2FE"/>
  </g>
</svg>

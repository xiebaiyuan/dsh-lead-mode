<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="dsh-lead-mode">
  <title>dsh-lead-mode</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131E36"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>

  <!-- 图形整体下移 88，让包围盒在画布内垂直居中 -->
  <g transform="translate(0 88)">
    <!-- 三条派活连线：从中心点边缘到空心圆外缘 -->
    <g stroke="#2B3A5C" stroke-width="34" stroke-linecap="round">
      <line x1="512" y1="462" x2="512" y2="368"/>
      <line x1="631.511" y1="669" x2="712.918" y2="716"/>
      <line x1="392.489" y1="669" x2="311.082" y2="716"/>
    </g>

    <!-- Lead：实心主圆点 -->
    <circle cx="512" cy="600" r="138" fill="#4D6BFE"/>

    <!-- 三个成员：空心圆 -->
    <g fill="none" stroke="#E6EDF3" stroke-width="40">
      <circle cx="512" cy="248" r="100"/>
      <circle cx="816.841" cy="776" r="100"/>
      <circle cx="207.159" cy="776" r="100"/>
    </g>
  </g>
</svg>

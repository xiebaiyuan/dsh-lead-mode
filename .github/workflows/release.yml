name: release

# 打 `v*` tag 触发发布。发布靠 npm 的 Trusted Publishing（OIDC），不用存 token。
#
# 用之前要在 npmjs.com 配一次（只配一次）：
#   包页面 → Settings → Trusted Publisher → 选 GitHub Actions，填：
#     Organization or user  xiebaiyuan
#     Repository            dsh-lead-mode
#     Workflow filename     release.yml      ← 只写文件名，必须和本文件同名
#     Allowed actions       勾上 "npm publish"（"npm stage publish" 是默认允许的，
#                           只勾它的话 CI 只能暂存，还得人工 approve）
#
# 没配 Trusted Publisher 就发，会报 404/403，不是 workflow 写错了。
#
# 换 token 路子也行：建一个勾了 bypass 2FA 的 granular token，存成仓库 secret
# NPM_TOKEN，然后把下面 Publish 步骤的 env 加回来：
#   env:
#     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# 但**不能两个同时用**：NODE_AUTH_TOKEN 一旦有值，npm 就不走 OIDC 了。

on:
  push:
    tags: ['v*']
  # 补建或重建某一个已有 tag 的 GitHub Release。发布本身不会重复跑：
  # publish 只在 tag push 时执行，这里手动触发只走 github-release 那个 job。
  workflow_dispatch:
    inputs:
      tag:
        description: '已有 tag（例如 v0.2.4）'
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 换取 npm 的发布凭据，Trusted Publishing 必需
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 带的 npm 一定 ≥ 11.5.1，这是 Trusted Publishing 的最低要求。
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # 故意不跑 npm install。本包零 dependencies，测试与脚本只用 Node 内置模块；
      # 而 peerDependencies 里的 @deepseek-ai/* 会把九百多个包拉下来，白等几十分钟。
      # 发布本身也不需要 node_modules。

      - name: 测试
        run: node --test test/*.test.mjs

      - name: 语法
        run: node --check lib/index.js

      - name: 命名清单
        run: node scripts/validate-names.mjs --manifest ./dsh-plugin.naming.json

      - name: patch 能解析
        run: node scripts/check-patch.mjs

      - name: tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag 与 package.json 的 $pkg 不一致"
            exit 1
          fi

      - name: latest 不回退
        run: |
          new="$(node -p "require('./package.json').version")"
          cur="$(npm view dsh-lead-mode dist-tags.latest 2>/dev/null || true)"
          if [ -z "$cur" ]; then
            echo "查不到已发布的 latest，跳过比较"
            exit 0
          fi
          if [ "$new" = "$cur" ]; then
            echo "版本 $new 已经是 latest，不重复发布"
            exit 1
          fi
          highest="$(printf '%s\n%s\n' "$cur" "$new" | sort -V | tail -n 1)"
          if [ "$highest" != "$new" ]; then
            echo "新版本 $new 低于已发布 latest $cur，拒绝发布"
            exit 1
          fi
          echo "已发布 latest 是 $cur，本次发 $new"

      - name: 发布
        run: npm publish --access public

  # tag push 时在 npm 发布之后建 GitHub Release；也可以手动触发，给已有 tag 补建。
  # 说明取自 CHANGELOG.md 的对应小节，不用 --generate-notes：本仓库直接往 main
  # 提交，没有 PR 关联，自动生成的 notes 只有一串 commit 标题。
  github-release:
    needs: publish
    # publish 在手动触发时是 skipped，这时照样要建 release。
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create / edit 需要
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 从 CHANGELOG 取这一版的说明
        run: |
          version="${TAG#v}"
          node scripts/changelog-section.mjs "$version" notes.md
          {
            echo
            echo "npm: [\`dsh-lead-mode@${version}\`](https://www.npmjs.com/package/dsh-lead-mode/v/${version})"
          } >> notes.md
          echo "----- release notes -----"
          cat notes.md

      - name: 创建或更新 GitHub Release（标记 Latest）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "已存在 $TAG 的 release，改成更新说明"
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest --verify-tag
          fi
